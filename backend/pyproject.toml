[project]
name = "averonix-backend"
version = "0.1.0"
description = "Averonix Python backend: Agent + Manual Assessment engines for ISO/IEC 27001 readiness."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "dnspython>=2.6",
  "httpx>=0.27",
  "cryptography>=42",
  "tldextract>=5.1",
  "validators>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
